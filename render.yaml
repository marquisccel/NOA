# Cadangan penayangan gratis (Render): satu layanan web Docker + satu basis data PostgreSQL.
# Cara pakai: Render → New → Blueprint → pilih repositori ini.
services:
  - type: web
    name: noa
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: noa-db
          property: connectionString
      - key: NOA_DEMO
        value: "true"
      - key: NOA_UNGGAH
        value: "false"

databases:
  - name: noa-db
    plan: free
    databaseName: noa
    user: noa
