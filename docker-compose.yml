services:
  pgsql:
    image: postgres:17-alpine
    container_name: noa-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: noa
      POSTGRES_USER: noa
      POSTGRES_PASSWORD: noa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noa -d noa"]
      interval: 5s
      timeout: 3s
      retries: 10
