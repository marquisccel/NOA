name: Tes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: noa_test
          POSTGRES_USER: noa
          POSTGRES_PASSWORD: noa_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noa -d noa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: noa_test
      DB_USERNAME: noa
      DB_PASSWORD: noa_dev_password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist
          php artisan key:generate
          npm ci

      - name: Build aset
        run: npm run build

      - name: Jalankan tes
        run: php artisan test
